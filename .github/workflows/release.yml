name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare private signing key
        run: python3 scripts/signing.py
      - name: Verify and build signed release
        run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Check tag, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts
          mkdir -p dist
          APK="Saltabeat-v${VERSION}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          scripts/verify-apk.sh "dist/$APK"
          cd dist
          sha256sum "$APK" > "$APK.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Saltabeat $GITHUB_REF_NAME" --generate-notes
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/saltabeat-release.jks"
